version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mighty-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mighty
    ports:
      - "5432:5432"
    volumes:
      - mighty_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mighty"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    container_name: mighty-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mighty?schema=public"
      PORT: 3001
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      PRISMA_LOG: "true"
      # 비워두면 기본 지연(AI 1~1.5s, 트릭 1.5s)을 쓴다. E2E/스모크에서만 줄여서 넘긴다.
      AI_TURN_DELAY_MIN_MS: "${AI_TURN_DELAY_MIN_MS:-}"
      AI_TURN_DELAY_MAX_MS: "${AI_TURN_DELAY_MAX_MS:-}"
      TRICK_RESOLVED_DELAY_MS: "${TRICK_RESOLVED_DELAY_MS:-}"
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 브라우저에서 접근 가능한 백엔드 주소. 빌드 시점에 번들에 고정된다.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
    container_name: mighty-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mighty_pg_data:

networks:
  default:
    name: mighty-network
