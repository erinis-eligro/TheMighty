version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mighty-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mighty
    ports:
      - "5432:5432"
    volumes:
      - mighty_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mighty"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mighty-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mighty?schema=public"
      PORT: 3001
      CORS_ORIGIN: "http://localhost:3000"
      PRISMA_LOG: "true"
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mighty-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:3001
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mighty_pg_data:

networks:
  default:
    name: mighty-network
