services:
  postgres:
    image: postgres:15-alpine
    container_name: mighty-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mighty}
    ports:
      # 로컬 디버깅 전용: 호스트 loopback 에만 공개한다. 외부 접근이 필요하면 SSH 터널 등을 사용한다.
      - "127.0.0.1:5432:5432"
    volumes:
      - mighty_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-mighty}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      secrets:
        - npm_auth_token
    container_name: mighty-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mighty}?schema=public"
      PORT: 3001
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      PRISMA_LOG: "true"
      # 비워두면 기본 지연(AI 1~1.5s, 트릭 1.5s)을 쓴다. E2E/스모크에서만 줄여서 넘긴다.
      AI_TURN_DELAY_MIN_MS: "${AI_TURN_DELAY_MIN_MS:-}"
      AI_TURN_DELAY_MAX_MS: "${AI_TURN_DELAY_MAX_MS:-}"
      TRICK_RESOLVED_DELAY_MS: "${TRICK_RESOLVED_DELAY_MS:-}"
    ports:
      - "3001:3001"
    healthcheck:
      # 이미지에 curl 이 없어 busybox wget 을 쓴다. localhost 가 ::1 로 풀리는 것을 피하려 127.0.0.1 사용.
      # /stats/:username 은 DB 조회(읽기 전용)를 하므로 DB 연결까지 함께 확인된다.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/stats/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 시작 시 `prisma migrate deploy` 가 먼저 실행되므로 넉넉히 잡는다.
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 브라우저에서 접근 가능한 백엔드 주소. 빌드 시점에 번들에 고정된다.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
      secrets:
        - npm_auth_token
    container_name: mighty-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped

# 빌드 시 npm 인증(JFrog)용. 셸/.env 의 NPM_AUTH_TOKEN 값을 읽는다. 값은 저장소에 커밋하지 않는다.
secrets:
  npm_auth_token:
    environment: NPM_AUTH_TOKEN

volumes:
  mighty_pg_data:

networks:
  default:
    name: mighty-network
