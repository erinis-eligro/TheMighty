default:
  image: node:20-bookworm

backend-test:
  stage: test
  tags:
    - docker
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm ci
    - npx prisma generate
    - npm run build
    # rootDir 이 src 이므로 ../coverage = backend/coverage (sonarqube-check 가 lcov.info 를 사용한다)
    - npm test -- --coverage --coverageReporters=lcov --coverageDirectory=../coverage
    # jest 의 lcov 경로(src/...)를 저장소 루트 기준(backend/src/...)으로 바꾼다. (cwd = backend, 파일이 없으면 건너뛴다)
    # sonarqube-check 는 비root 로 실행되어 root 소유의 artifact 를 수정할 수 없으므로 여기(root)에서 처리한다.
    - if [ -f coverage/lcov.info ]; then sed -i 's#^SF:src/#SF:backend/src/#' coverage/lcov.info; fi
  artifacts:
    expire_in: 1 week
    paths:
      - backend/coverage/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend-check:
  stage: test
  tags:
    - docker
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# frontend/src/types/protocol.ts 는 backend/src/game/protocol.ts 의 수동 복사본이다. 어긋나면 실패시킨다.
protocol-sync:
  stage: test
  tags:
    - docker
  script:
    - diff backend/src/game/protocol.ts frontend/src/types/protocol.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# prisma 스키마 유효성 + 마이그레이션 누락 점검 (schema.prisma 를 바꾸고 migration 을 안 만들면 실패).
prisma-check:
  stage: test
  tags:
    - docker
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: mighty
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm ci
    - export DATABASE_URL="postgresql://postgres:postgres@postgres:5432/mighty?schema=public"
    - npx prisma validate
    # 빈 CI DB 를 shadow DB 로 사용해 migrations 를 적용한 결과와 schema.prisma 를 비교한다. (차이가 있으면 exit 2)
    - npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 브라우저 E2E (Playwright). 느리므로 MR 마다 돌리지 않고 수동 실행/스케줄(야간)로만 돌린다.
frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  tags:
    - docker
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: mighty
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mighty?schema=public"
    NEXT_PUBLIC_BACKEND_URL: "http://localhost:3001"
  script:
    - cd backend
    - npm ci
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run build
    - cd ../frontend
    - npm ci
    - npm run build
    - npx playwright test
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# SonarQube 정적 분석(SAST). 설정은 루트 sonar-project.properties 참고.
# 필요한 CI/CD 변수 (Settings > CI/CD > Variables):
#   - SONAR_HOST_URL : SonarQube 서버 URL
#   - SONAR_TOKEN    : 분석 토큰 (Masked)
#   - SONAR_PR_ANALYSIS : (선택) "true" 면 MR 분석에 sonar.pullrequest.* 를 넘긴다. Developer 에디션 이상에서만 설정한다.
#     Community 에디션은 PR 분석을 지원하지 않으므로 설정하지 않으면 MR 의 변경 코드를 main 대상으로 분석한다.
# 커버리지(backend/coverage/lcov.info)의 경로 보정(SF:src/ -> SF:backend/src/)은 backend-test 에서 이미 끝난 상태로 artifact 를 받는다.
# SONAR_HOST_URL/SONAR_TOKEN 이 없으면 job 이 생성되지 않는다. (포크, 설정 전 환경)
# main 을 대상으로 하는 Merge Request 파이프라인과 main 브랜치 푸시 파이프라인에서 실행한다.
# main 푸시 파이프라인에는 CI_MERGE_REQUEST_* 변수가 없으므로 SONAR_PR_ANALYSIS 가 true 여도 sonar.pullrequest.* 를 넘기지 않는다.
# 처음에는 allow_failure: true 로 품질 게이트 실패가 MR 을 막지 않게 한다.
# 기존 이슈가 정리되면 allow_failure 를 제거해 필수 검사로 전환한다.
sonarqube-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  tags:
    - docker
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - ${CI_PROJECT_DIR}/.sonar/cache
  needs:
    - job: backend-test
      artifacts: true
      optional: true
  script:
    - |
      PR_ARGS=""
      if [ "$SONAR_PR_ANALYSIS" = "true" ] && [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        PR_ARGS="-Dsonar.pullrequest.key=$CI_MERGE_REQUEST_IID -Dsonar.pullrequest.branch=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME -Dsonar.pullrequest.base=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      fi
      sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}" -Dsonar.qualitygate.wait=true $PR_ARGS
  allow_failure: true
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
