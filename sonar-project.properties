# SonarQube 정적 분석 설정 (모노레포: backend/ + frontend/).
# sonar.projectKey 는 SonarQube 서버에 만든 프로젝트 키와 같아야 한다. 다르면 이 값을 서버 키에 맞춘다.
sonar.projectKey=themighty
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,frontend/e2e/**,backend/prisma/migrations/**

sonar.tests=backend/src
sonar.test.inclusions=**/*.spec.ts

# backend-test 가 생성하는 커버리지 (파일이 없어도 분석은 실패하지 않는다).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
